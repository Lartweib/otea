name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks on main plus the queued pull requests before it merges them.
  merge_group:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run takes under 5 minutes; a hang should fail long before the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # On Windows, TEMP is on the OS disk (C:), where the small-file I/O of the tests' temp git
      # repos made the tests take twice as long; the runner's own temp folder is on its local disk
      # (D:).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check

  # The desktop app is its own package. Here its types are checked and its bundle built: the
  # Electron binary is not downloaded, and its pure parts already run in the check job's tests. The
  # installers are built and tried by desktop.yml.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The shell imports ui/src/attention.ts, whose types reach the core (zod, yaml).
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
