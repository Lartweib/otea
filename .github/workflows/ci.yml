name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the checks on main plus the queued pull requests before it merges them.
  merge_group:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run takes under 5 minutes; a hang should fail long before the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # The desktop app is its own package. Here its types are checked and its bundle built: the
  # Electron binary is not downloaded, and its pure parts already run in the check job's tests. The
  # installers are built and tried by desktop.yml.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # The shell imports ui/src/attention.ts, whose types reach the core (zod, yaml).
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
