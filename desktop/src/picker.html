<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Otea</title>
    <style>
      @font-face {
        font-family: 'Newsreader Variable';
        font-style: normal;
        font-weight: 200 800;
        src: url('fonts/newsreader-latin-opsz-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Newsreader Variable';
        font-style: italic;
        font-weight: 200 800;
        src: url('fonts/newsreader-latin-opsz-italic.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Schibsted Grotesk Variable';
        font-style: normal;
        font-weight: 400 900;
        src: url('fonts/schibsted-grotesk-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'DM Mono';
        font-style: normal;
        font-weight: 400;
        src: url('fonts/dm-mono-latin-400-normal.woff2') format('woff2');
      }
      /* The web UI's tokens (ui/src/styles/tokens.css), the few this page uses. */
      :root {
        --serif: 'Newsreader Variable', 'Iowan Old Style', Georgia, serif;
        --sans: 'Schibsted Grotesk Variable', 'Helvetica Neue', Arial, sans-serif;
        --mono: 'DM Mono', ui-monospace, Consolas, monospace;
        --ground: oklch(0.98 0.005 268);
        --sheet: oklch(0.995 0.0025 268);
        --dot: oklch(0.885 0.009 268);
        --hov: oklch(0.962 0.009 268);
        --ink: oklch(0.215 0.022 266);
        --ink-2: oklch(0.43 0.017 267);
        --ink-3: oklch(0.51 0.016 268);
        --rule: oklch(0.918 0.007 268);
        --rule-2: oklch(0.855 0.009 268);
        --you: oklch(0.5 0.2 266);
        --on-you: oklch(0.99 0.005 266);
        --warn: oklch(0.55 0.17 30);
        --shadow: oklch(0.32 0.05 266 / 0.2);
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: oklch(0.2 0.013 266);
          --sheet: oklch(0.228 0.014 266);
          --dot: oklch(0.3 0.013 266);
          --hov: oklch(0.25 0.016 266);
          --ink: oklch(0.945 0.006 266);
          --ink-2: oklch(0.77 0.012 266);
          --ink-3: oklch(0.69 0.013 266);
          --rule: oklch(0.29 0.013 266);
          --rule-2: oklch(0.37 0.014 266);
          --you: oklch(0.69 0.165 268);
          --on-you: oklch(0.17 0.03 266);
          --warn: oklch(0.71 0.15 36);
          --shadow: oklch(0.06 0.01 266 / 0.7);
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; }
      body {
        background-color: var(--ground);
        background-image: radial-gradient(circle, var(--dot) 0.9px, transparent 1.1px);
        background-size: 22px 22px;
        color: var(--ink);
        font: 400 14px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 16px;
        overflow-y: auto;
      }
      main { width: 100%; max-width: 460px; margin: auto 0; }
      .mark { display: block; width: 36px; height: 36px; margin-bottom: 28px; }
      .mark circle { stroke: var(--ink); }
      .mark .orbit { fill: var(--you); transform-origin: 20px 20px; opacity: 0; }
      .opening .mark .orbit { opacity: 1; }
      .opening .mark .orbit { animation: turn 2.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .opening .mark .orbit { animation: none; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      h1 {
        font: 400 40px/1.05 var(--serif);
        font-variation-settings: 'opsz' 72;
        letter-spacing: -0.015em;
        margin: 0 0 10px;
      }
      .dek {
        font: italic 400 18px/1.4 var(--serif);
        font-variation-settings: 'opsz' 18;
        color: var(--ink-2);
        margin: 0 0 28px;
      }
      .moves { display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        font: 600 14px/20px var(--sans);
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid var(--rule-2);
        background: var(--sheet);
        color: var(--ink);
        cursor: pointer;
        transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
      }
      .btn:hover { background: var(--hov); border-color: var(--ink-3); }
      .btn.primary { background: var(--you); border-color: var(--you); color: var(--on-you); }
      .btn.primary:hover { background: color-mix(in oklch, var(--you), var(--ink) 14%); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn:focus-visible, .row:focus-visible, .forget:focus-visible {
        outline: 2px solid var(--you);
        outline-offset: 2px;
      }
      .error { color: var(--warn); margin: 16px 0 0; }
      .error:empty { display: none; }
      .status { font: italic 400 18px/1.4 var(--serif); color: var(--ink-2); margin: 0; }
      .recent {
        margin-top: 40px;
        background: var(--sheet);
        border: 1px solid var(--rule);
        border-radius: 12px;
        box-shadow: 0 12px 32px -24px var(--shadow);
        padding: 14px 6px 6px;
      }
      .kicker {
        font: 600 10.5px/1 var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin: 0 10px 8px;
      }
      ul { list-style: none; margin: 0; padding: 0; }
      li { position: relative; }
      .row {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 8px;
        padding: 8px 40px 8px 10px;
        color: inherit;
        cursor: pointer;
        transition: background-color 120ms var(--ease);
      }
      .row:hover { background: var(--hov); }
      .name {
        display: block;
        font: 400 18px/1.3 var(--serif);
        font-variation-settings: 'opsz' 18;
      }
      .path {
        display: block;
        font: 400 12px/1.5 var(--mono);
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;
        text-align: left;
      }
      .forget {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--ink-3);
        cursor: pointer;
        opacity: 0;
        transition: opacity 120ms var(--ease), background-color 120ms var(--ease);
      }
      li:hover .forget, .forget:focus-visible { opacity: 1; }
      .forget:hover { background: var(--rule); color: var(--ink); }
    </style>
  </head>
  <body>
    <main id="picker" hidden>
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="12.5" fill="none" stroke-width="6.5" />
        <circle class="orbit" cx="20" cy="2" r="2" />
      </svg>
      <h1 id="title">Otea</h1>
      <p class="dek" id="dek"></p>
      <div class="moves" id="moves">
        <button class="btn primary" id="open-folder" type="button"></button>
        <button class="btn" id="create" type="button"></button>
      </div>
      <p class="status" id="status" hidden></p>
      <p class="error" id="error" role="alert"></p>
      <section class="recent" id="recent" hidden>
        <h2 class="kicker" id="recent-title">Recent</h2>
        <ul id="recent-list"></ul>
      </section>
    </main>
    <script src="picker.js"></script>
  </body>
</html>
