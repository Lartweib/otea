preset: bug-triage
preset_version: 3
playbook: ./playbook.md
icon: bug
fields:
  title: { module: text, required: create }
  description: { module: markdown, required: complete }
  steps: { module: markdown, required: complete }
  expected: { module: markdown, required: complete }
  actual: { module: markdown, required: complete }
  environment: { module: text }
  severity: { module: severity, required: complete }
  category: { module: enum, values: [crash, visual, gameplay, physics, audio, performance, ui] }
  # The part of the product, in the project's words. The grid filters and groups by it as written,
  # lowercased; a project's own preset can make it an enum, to fix its values.
  area: { module: text }
workflow:
  initial: reported
  incomplete: incomplete
  states:
    incomplete: { turn: agent }
    reported: { turn: human }
    needs_info: { turn: agent }
    accepted: { turn: agent }
    fixing: { turn: agent }
    verify: { turn: human }
    fixed: { turn: none, closes: done }
    rejected: { turn: none, closes: discarded }
    duplicate: { turn: none, closes: discarded }
    wont_fix: { turn: none, closes: discarded }
  transitions:
    - { from: incomplete, to: reported, by: agent }
    - { from: reported, to: accepted, by: human }
    - { from: reported, to: needs_info, by: human, reason: required }
    - { from: needs_info, to: reported, by: agent }
    - { from: accepted, to: fixing, by: agent }
    - { from: fixing, to: verify, by: agent, reason: required }
    - { from: [accepted, fixing], to: reported, by: agent, reason: required }
    - { from: verify, to: fixed, by: human-ui }
    - { from: verify, to: fixing, by: human, reason: required }
    - { from: [incomplete, reported, needs_info], to: rejected, by: human-ui, reason: required }
    - { from: [incomplete, reported, needs_info], to: duplicate, by: human-ui, reason: required }
    - {
        from: [incomplete, reported, needs_info, accepted, fixing, verify],
        to: wont_fix,
        by: human-ui,
        reason: required,
      }
# The only type, named so items read as bugs.
types:
  bug:
    label: Bug
    icon: bug
view:
  kind: grid
  columns: [id, title, state, severity, category, area, who, age]

# The preset's words in English and Spanish, for the web UI; agents and the CLI keep the keys.
labels:
  en:
    name: Bug triage
    types: { bug: Bug }
    states:
      incomplete: Incomplete
      reported: Reported
      needs_info: Needs info
      accepted: Accepted
      fixing: Fixing
      verify: To verify
      fixed: Fixed
      rejected: Rejected
      duplicate: Duplicate
      wont_fix: Won't fix
    fields:
      title: Title
      description: Description
      steps: Steps
      expected: Expected
      actual: Actual
      environment: Environment
      severity: Severity
      category: Category
      area: Area
    values:
      severity: { low: low, medium: medium, high: high, critical: critical }
      category:
        crash: crash
        visual: visual
        gameplay: gameplay
        physics: physics
        audio: audio
        performance: performance
        ui: UI
  es:
    name: Errores
    types: { bug: Error }
    states:
      incomplete: Incompleto
      reported: Reportado
      needs_info: Falta información
      accepted: Aceptado
      fixing: En arreglo
      verify: A verificar
      fixed: Arreglado
      rejected: Rechazado
      duplicate: Duplicado
      wont_fix: No se arreglará
    fields:
      title: Título
      description: Descripción
      steps: Pasos
      expected: Lo esperado
      actual: Lo que pasa
      environment: Entorno
      severity: Severidad
      category: Categoría
      area: Área
    values:
      severity: { low: baja, medium: media, high: alta, critical: crítica }
      category:
        crash: cierre inesperado
        visual: visual
        gameplay: jugabilidad
        physics: física
        audio: audio
        performance: rendimiento
        ui: interfaz
