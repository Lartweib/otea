preset: tasks
preset_version: 2
playbook: ./playbook.md
# The icon of its collections; the task type keeps its own.
icon: checklist
fields:
  title: { module: text, required: create }
  description: { module: markdown, required: complete }
  priority: { module: enum, values: [low, medium, high], default: medium }
workflow:
  initial: todo
  incomplete: incomplete
  states:
    incomplete: { turn: agent }
    todo: { turn: agent }
    in_progress: { turn: agent }
    review: { turn: human }
    done: { turn: none, closes: done }
    discarded: { turn: none, closes: discarded }
  transitions:
    - { from: incomplete, to: todo, by: agent }
    - { from: todo, to: in_progress, by: agent }
    - { from: in_progress, to: review, by: agent }
    - { from: review, to: done, by: human-ui }
    - { from: review, to: todo, by: human-ui, reason: required }
    - { from: [incomplete, todo, in_progress, review], to: discarded, by: human, reason: required }
    - { from: incomplete, to: discarded, by: agent, reason: required }
# The only type, named so items read as tasks.
types:
  task:
    label: Task
    icon: checkbox

# The preset's words in English and Spanish, for the web UI; agents and the CLI keep the keys.
labels:
  en:
    name: Tasks
    types: { task: Task }
    states:
      incomplete: Incomplete
      todo: To do
      in_progress: In progress
      review: In review
      done: Done
      discarded: Discarded
    fields: { title: Title, description: Description, priority: Priority }
    values:
      priority: { low: Low, medium: Medium, high: High }
  es:
    name: Tareas
    types: { task: Tarea }
    states:
      incomplete: Incompleta
      todo: Por hacer
      in_progress: En curso
      review: En revisión
      done: Hecho
      discarded: Descartado
    fields: { title: Título, description: Descripción, priority: Prioridad }
    values:
      priority: { low: baja, medium: media, high: alta }
